org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 (the default engine for this KSP version) has a known multi-round
# resolution race when Room's and Hilt's KSP processors run together --
# reproduced reliably on GitHub Actions' runners as "type X could not be
# resolved" for AppDatabase/repositories during kspReleaseKotlin, though not
# on every machine. Falling back to the legacy KSP1 engine avoids it.
ksp.useKSP2=false
