services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: trails
      POSTGRES_PASSWORD: trails
      POSTGRES_DB: trails
    volumes:
      # Postgres 18's image expects the volume at /var/lib/postgresql (not
      # .../data) so it can manage major-version-specific subdirectories
      # itself (pg_ctlcluster-compatible layout).
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trails -d trails"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trails:trails@db:5432/trails?schema=public
      NODE_ENV: production
      # spec-push-notifications: the VAPID keypair for Web Push, read from
      # the repo-root .env (gitignored) so the private key never lands in
      # this file. Unset = the notification opt-in never appears at all.
      # Note that notifications additionally need HTTPS in front of this
      # (secure-context-only APIs), which the default local setup has not
      # got -- localhost is exempt, so `next dev` can still be used to
      # exercise the flow.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - '3000:3000'
    healthcheck:
      # No curl/wget in the node:24-bookworm-slim runner image -- use Node's
      # built-in fetch instead. Hits the public /login page (no session
      # required, AD-7) so readiness doesn't depend on auth state.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # AD-5's mandatory upload path shape (/data/uploads/{trip_id}/...),
      # written to by app/api/v1/attachments/route.ts (spec-documents).
      - uploads:/data/uploads

volumes:
  pg-data:
  uploads:
